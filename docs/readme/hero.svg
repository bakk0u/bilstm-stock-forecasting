<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="395" viewBox="0 0 1000 395" role="img" aria-labelledby="title"><title id="title">BiLSTM Stock Forecasting — Forecast returns. Challenge the model.</title><defs><linearGradient id="spectrum"><stop stop-color="#438cff"/><stop offset=".6" stop-color="#ff69c8"/><stop offset="1" stop-color="#ffe46b"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.orbit{animation:orbit 20s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}.draw{stroke-dasharray:500;animation:draw 8s ease-in-out infinite}.flow{stroke-dasharray:5 13;animation:flow 6s linear infinite}.slide{animation:slide 8s ease-in-out infinite}@keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}@keyframes draw{0%{stroke-dashoffset:500}70%,100%{stroke-dashoffset:0}}@keyframes flow{to{stroke-dashoffset:-144}}@keyframes slide{0%,15%,100%{transform:translateX(0)}50%,70%{transform:translateX(64px)}}@media(prefers-reduced-motion:reduce){.orbit,.pulse,.draw,.flow,.slide{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect x="1" y="1" width="998" height="393" rx="22" fill="#070b18" stroke="#26374f"/><text x="38" y="38" font-size="11" fill="#438cff" font-weight="700">FINANCIAL ML / WALK-FORWARD EVALUATION</text><text x="38" y="100" font-size="55" fill="#eff5ff" font-weight="700">BiLSTM</text><text x="38" y="163" font-size="55" fill="#eff5ff" font-weight="700">Stock Forecasting</text><text x="38" y="212" font-size="24" fill="#438cff" font-weight="400">Forecast returns.</text><text x="38" y="243" font-size="24" fill="#438cff" font-weight="400">Challenge the model.</text><g transform="translate(650 55) scale(1)"><rect x="0" y="30" width="94" height="170" rx="5" fill="#438cff" opacity=".08" stroke="none"/><rect x="100" y="30" width="94" height="170" rx="5" fill="#ff69c8" opacity=".08" stroke="none"/><rect x="200" y="30" width="94" height="170" rx="5" fill="#ffe46b" opacity=".08" stroke="none"/><path d="M0 65L300 65" fill="none" stroke="#26374f" stroke-width="1" class=""/><path d="M0 105L300 105" fill="none" stroke="#26374f" stroke-width="1" class=""/><path d="M0 145L300 145" fill="none" stroke="#26374f" stroke-width="1" class=""/><path d="M0 185L300 185" fill="none" stroke="#26374f" stroke-width="1" class=""/><path d="M0 132L18 112L36 140L54 94L72 122L90 66L108 99L126 82L144 143L162 108L180 161L198 126L216 134L234 94L252 120L270 76L294 104" fill="none" stroke="#438cff" stroke-width="2" class="draw"/><path d="M0 126L295 126" fill="none" stroke="#ffe46b" stroke-width="1" class="flow"/><text x="0" y="222" font-size="11" fill="#aabbd5" font-weight="400">PAST</text><text x="102" y="222" font-size="11" fill="#aabbd5" font-weight="400">VALIDATE</text><text x="215" y="222" font-size="11" fill="#aabbd5" font-weight="400">TEST</text><text x="55" y="253" font-size="10" fill="#aabbd5" font-weight="400">CONCEPT ANIMATION</text></g><rect x="38" y="375" width="924" height="2" rx="1" fill="url(#spectrum)" stroke="none"/><text x="38" y="350" font-size="11" fill="#aabbd5" font-weight="700">BUILD / EXPERIMENT / EXPLAIN</text></svg>